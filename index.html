<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kevin Xiao</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1/dist/geist-mono.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="background"></div>

  <div id="terminal">
    <div id="title-bar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="title-text">kevin@portfolio ~ nvim</span>
    </div>
    <div id="content"></div>
    <div id="status-bar">
      <span id="mode-indicator">NORMAL</span>
      <span id="current-path">~/portfolio</span>
      <span>
        <span id="count-display"></span>
        <span id="cursor-pos"></span>
      </span>
    </div>
  </div>

  <div id="command-bar" class="hidden">
    <input id="command-input" type="text" autocomplete="off" spellcheck="false" />
  </div>

  <div id="notification" class="hidden"></div>

  <script src="main.js"></script>
</body>
</html>
